<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multica 整体理解架构图</title><style>*{box-sizing:border-box}body{margin:0;background:#e7edf1;color:#203143;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}header{padding:14px 20px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid #d4dde4}a{color:#315f87;text-underline-offset:4px}.controls{display:flex;gap:8px;align-items:center}button{background:#f4f6f8;border:1px solid #cbd6df;border-radius:6px;padding:7px 12px;cursor:pointer;color:#203143;font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #448bc1;outline-offset:3px}#canvas{height:calc(100dvh - 82px);overflow:auto;padding:18px}img{display:block;width:100%;max-width:1800px;height:auto;margin:auto;border-radius:16px;box-shadow:0 3px 24px #20314314}#zoom{min-width:50px;text-align:center}@media print{header{display:none}#canvas{height:auto;overflow:visible;padding:0}img{width:100%!important;box-shadow:none}}</style></head><body><header><a href="review.html">← 完整理解文档</a><div class="controls"><button id="overview">整图总览</button><button id="fit">适应宽度</button><button id="out" aria-label="缩小架构图">−</button><span id="zoom" aria-live="polite">适应</span><button id="in" aria-label="放大架构图">＋</button><button id="actual">原始大小</button></div><a href="assets/architecture.svg" download>下载 SVG</a></header><div id="canvas"><img id="diagram" src="assets/architecture.svg" alt="Multica 整体理解：人工控制、平台编排、Agent 工具执行、小队交接、价值与边界"></div><script>const diagram=document.getElementById('diagram'),canvas=document.getElementById('canvas'),label=document.getElementById('zoom');let scale=1;function apply(value){scale=Math.max(.25,Math.min(2,value));diagram.style.width=1800*scale+'px';diagram.style.maxWidth='none';label.textContent=Math.round(scale*100)+'%'}function overview(){apply(Math.min((canvas.clientWidth-36)/1800,(canvas.clientHeight-36)/1810,1));canvas.scrollTo(0,0)}document.getElementById('overview').onclick=overview;window.addEventListener('load',overview);document.getElementById('fit').onclick=()=>{diagram.style.width='100%';diagram.style.maxWidth='1800px';label.textContent='适应';canvas.scrollTo(0,0)};document.getElementById('actual').onclick=()=>apply(1);document.getElementById('in').onclick=()=>apply(diagram.getBoundingClientRect().width/1800+.25);document.getElementById('out').onclick=()=>apply(diagram.getBoundingClientRect().width/1800-.25);</script></body></html>
