<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1810" viewBox="0 0 1800 1810" role="img" aria-labelledby="title desc">
<title id="title">Multica 整体理解：人参与控制，平台编排，Agent 工具执行</title>
<desc id="desc">上方为人的派工、过程干预和评审；左侧展示平台到工具和模型的执行架构；右侧展示组长成员交接；下方总结边界、价值、扩展入口和实测证据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718394"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#203143}.title{font-size:40px;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:23px}.s{font-size:20px;fill:#526479}.tag{font-size:19px;font-weight:700;fill:#ac4836}.line{fill:none;stroke:#718394;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1800" height="1810" rx="24" fill="#f5f7f8"/>
<text x="44" y="43" class="tag">011 / MULTICA · 完整理解总览 · 事件驱动与并发</text>
<text x="44" y="97" class="title">人参与控制，平台组织工作，Agent 工具调用模型执行</text>
<text x="44" y="133" class="b">核心定位：已有 Agent 工具之上的协作与执行编排平台。看板是入口，任务、运行与事件构成工作闭环。</text>
<rect x="44" y="162" width="1712" height="142" rx="14" fill="#fff0e8" stroke="#edcebe"/>
<text x="68" y="200" class="h">人 / HUMAN IN THE LOOP</text>
<text x="68" y="238" class="s">开始：提目标、定验收标准、选负责人</text>
<text x="68" y="268" class="s">可直派单 Agent，也可分配小队</text>
<text x="660" y="238" class="s">过程：看日志与工具调用、评论纠偏</text>
<text x="660" y="268" class="s">@指定执行者、停止 Run、调整分工</text>
<text x="1212" y="238" class="s">结束：检查产物、评审与验收</text>
<text x="1212" y="268" class="s">通过 → 完成；不通过 → 评论返工</text>
<path class="line" d="M565 304V363"/>
<text x="590" y="340" class="s">Web / CLI / API；事件与定时也可触发</text>
<path class="line" d="M1690 376V313" stroke-dasharray="7 6"/>
<text x="1390" y="341" class="s">结果回到人；意见进入后续执行</text>
<rect x="44" y="376" width="1052" height="158" rx="14" fill="#eaf1fa" stroke="#c6d8ea"/>
<text x="68" y="416" class="h">① 平台执行调度 · Go 服务 + PostgreSQL</text>
<text x="68" y="454" class="s">Issue / Run / 身份与权限</text>
<text x="68" y="484" class="s">目标与每次执行分别记录</text>
<text x="435" y="454" class="s">事件路由 / 队列 / 并发约束</text>
<text x="435" y="484" class="s">领取、去重、取消、重试与恢复</text>
<text x="828" y="454" class="s">API / WebSocket</text>
<text x="828" y="484" class="s">Redis 为可选设施</text>
<path class="line" d="M570 534V577"/>
<text x="595" y="563" class="s">持久队列 → 领取任务；进度与结果反向回传</text>
<rect x="44" y="586" width="1052" height="132" rx="14" fill="#eaf5f0" stroke="#c5dfd3"/>
<text x="68" y="626" class="h">② 执行机器 · Daemon 守护进程</text>
<text x="68" y="665" class="s">发现可用工具 → 领取任务 → 准备工作目录、指令和配置 → 启动进程</text>
<text x="68" y="695" class="s">维护连接与执行生命周期，收集消息、工具事件、错误和结果</text>
<path class="line" d="M570 718V747"/>
<rect x="44" y="756" width="1052" height="96" rx="14" fill="#ffffff" stroke="#d7e0e7"/>
<text x="68" y="796" class="h">③ Provider 适配 · 统一 Agent 工具执行接口</text>
<text x="68" y="828" class="s">Execute → Session / 流式消息 / 结果；取消、续接、模型选项等支持因工具而异</text>
<path class="line" d="M570 852V886"/>
<rect x="44" y="895" width="455" height="109" rx="14" fill="#ffffff" stroke="#d7e0e7"/>
<text x="68" y="934" class="h">④ Agent 工具</text>
<text x="68" y="973" class="b">Codex / Claude Code / 其他工具</text>
<path class="line" d="M499 950H562"/>
<rect x="571" y="895" width="525" height="109" rx="14" fill="#ffffff" stroke="#d7e0e7"/>
<text x="595" y="934" class="h">模型推理 ↔ 工具执行循环</text>
<text x="595" y="973" class="b">文件、命令、MCP、外部业务系统</text>
<rect x="1124" y="376" width="632" height="628" rx="14" fill="#fffdf9" stroke="#e3dccf"/>
<text x="1148" y="416" class="h">小队协作 · 组长判断分工，平台落实</text>
<rect x="1148" y="443" width="584" height="73" rx="9" fill="#ffffff" stroke="#e6e1d8"/>
<text x="1166" y="472" class="b">1  分配 Issue 给小队</text>
<text x="1166" y="500" class="s">平台创建组长 Run，注入协议、名单与 Skills</text>
<path class="line" d="M1190 516V530"/>
<rect x="1148" y="534" width="584" height="73" rx="9" fill="#ffffff" stroke="#e6e1d8"/>
<text x="1166" y="563" class="b">2  组长发布委派评论</text>
<text x="1166" y="591" class="s">结构化 @成员 ID + 自然语言工作要求</text>
<path class="line" d="M1190 607V621"/>
<rect x="1148" y="625" width="584" height="73" rx="9" fill="#ffffff" stroke="#e6e1d8"/>
<text x="1166" y="654" class="b">3  平台安排成员 Run</text>
<text x="1166" y="682" class="s">成员排队/执行；组长结束本轮，不持续等待</text>
<path class="line" d="M1190 698V712"/>
<rect x="1148" y="716" width="584" height="73" rx="9" fill="#ffffff" stroke="#e6e1d8"/>
<text x="1166" y="745" class="b">4  成员回写结果和产物位置</text>
<text x="1166" y="773" class="s">任务与评论是交接点；文件需分支/PR 等交接</text>
<path class="line" d="M1190 789V803"/>
<rect x="1148" y="807" width="584" height="73" rx="9" fill="#ffffff" stroke="#e6e1d8"/>
<text x="1166" y="836" class="b">5  事件再次唤醒组长</text>
<text x="1166" y="864" class="s">读新反馈 → 继续委派 / 请求人处理 / 待评审</text>
<path class="line" d="M1190 880V894"/>
<rect x="1148" y="898" width="584" height="73" rx="9" fill="#ffffff" stroke="#e6e1d8"/>
<text x="1166" y="927" class="b">6  人检查与反馈</text>
<text x="1166" y="955" class="s">验收通过，或 @组长 提出修改意见再执行</text>
<rect x="44" y="1030" width="1712" height="78" rx="14" fill="#203143" stroke="#203143"/>
<text x="68" y="1063" style="font-size:25px;font-weight:700;fill:white">共同工作记录：Issue 保存目标、讨论、负责人和验收状态；一个 Issue 可对应多次 Run。</text>
<text x="68" y="1093" style="font-size:22px;fill:#d8e4ee">Run 保存一次执行及日志。Agent 是配置好的角色，Runtime 是执行环境，Leader 是协调角色，模型提供推理。</text>
<rect x="44" y="1134" width="838" height="242" rx="14" fill="#fff0e8" stroke="#edcebe"/>
<text x="68" y="1174" class="h">控制边界 · 回顾时不能混淆</text>
<text x="68" y="1211" class="s">评论 / 改状态 / 换负责人 ≠ 立即中断；停止要操作具体 Run。</text>
<text x="68" y="1242" class="s">Run completed ≠ 验收通过；待评审 ≠ 强制人工审批关卡。</text>
<text x="68" y="1273" class="s">默认面向无人值守；发布前必须审批，需要实际权限/流程约束。</text>
<text x="68" y="1304" class="s">取消 ≠ 回滚；共享评论 ≠ 共享模型会话或各机器文件。</text>
<text x="68" y="1335" class="s">目录隔离 ≠ 安全沙箱；本地执行 ≠ 数据全不出机器。</text>
<rect x="908" y="1134" width="848" height="242" rx="14" fill="#eef3f8" stroke="#d2deea"/>
<text x="932" y="1174" class="h">价值与扩展 · 为业务闭环服务</text>
<text x="932" y="1211" class="s">价值：减少协调，让工作可分配、可追踪、可交接、可复查。</text>
<text x="932" y="1242" class="s">场景：研发、CI/故障、周期巡检、知识工作；需要业务工具与验收。</text>
<text x="932" y="1273" class="s">已有入口：Provider、Skills、插件/MCP、API/Hook、Autopilot。</text>
<text x="932" y="1304" class="s">扩展建议：强制审批、知识积累、效果/成本路由、隔离执行环境。</text>
<text x="932" y="1335" class="s">衡量收益：验收通过率、返工、人工介入、耗时与费用。</text>
<rect x="44" y="1400" width="1712" height="126" rx="14" fill="#eef3f8" stroke="#d2deea"/>
<text x="68" y="1440" class="h">顺序与并行 · 依赖决定先后，资源约束并发</text>
<text x="68" y="1477" class="s">独立任务 / 独立成员可以并行；有依赖的步骤等待结果。</text>
<text x="68" y="1507" class="s">平台按需启动或续接 Agent；Agent 工具内部可多次调用模型。</text>
<text x="932" y="1477" class="s">并发受 Agent / Daemon 设置、节点容量与目录锁约束。</text>
<text x="932" y="1507" class="s">本次单成员交接是顺序示例，未单独实测并行负载。</text>
<rect x="44" y="1550" width="1712" height="150" rx="14" fill="#eaf5f0" stroke="#c5dfd3"/>
<text x="68" y="1590" class="h">本次实测 · 原版真实运行，证据与未验证范围分开</text>
<text x="68" y="1628" class="s">LAB-1：Claude Code 真实写文件并回传结果。</text>
<text x="68" y="1658" class="s">LAB-2：Codex 组长 → 成员 → 组长，三次 Run 完成。</text>
<text x="932" y="1628" class="s">观察到排队，实际执行过人工停止；两任务保留待评审。</text>
<text x="932" y="1658" class="s">未实测完整人工返工、强制审批、多机规模及外部业务集成。</text>
<text x="44" y="1741" class="s">重要限定：适配 Agent 工具 ≠ 模型网关/自动负载均衡；人工改交 Claude 成功 ≠ 平台自动故障切换。</text>
<text x="44" y="1774" class="s">依据：multica-ai/multica · 9d36136 · 2026-09-09｜Multica License 含额外条件｜完整细节见回顾文档｜研究资料发布版</text>
</svg>
