<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">MetaGPT 架构：任务、调度、角色与执行</title><desc id="desc">Team 控制预算和轮数，Environment 分发消息。默认 MGXEnv 通过负责人分派；固定流程由角色监听上游事件。角色结合提示词、工具和记忆执行。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#809096"/></marker></defs>
<rect width="1280" height="790" rx="24" fill="#f6f8f5"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#172f35">
<text x="44" y="53" font-size="17" fill="#53757c" letter-spacing="2">METAGPT / ARCHITECTURE</text>
<text x="44" y="100" font-size="32" font-weight="600">把岗位分工，变成可执行的消息交接。</text>
<text x="44" y="134" font-size="17" fill="#63777b">蓝色：通用框架　绿色：默认软件团队　橙色：本次实际验证的固定流程</text>
<g stroke="#809096" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M252 225H304"/><path d="M566 225H618"/><path d="M916 225H966"/><path d="M1112 274V341H972V377"/><path d="M779 274V342H328V377"/><path d="M328 481V531H505V568"/><path d="M972 481V531H772V568"/></g>
<rect x="44" y="179" width="208" height="94" rx="13" fill="#fff" stroke="#d5dfdb"/><text x="65" y="215" font-size="22" font-weight="600">用户任务</text><text x="65" y="247" font-size="16">输入 · 目标 · 验收标准</text>
<rect x="306" y="179" width="260" height="94" rx="13" fill="#e4eff4"/><text x="328" y="215" font-size="22" font-weight="600">Team</text><text x="328" y="247" font-size="16">组队 · 运行轮数 · 费用检查</text>
<rect x="620" y="179" width="296" height="94" rx="13" fill="#e4eff4"/><text x="642" y="215" font-size="22" font-weight="600">Environment</text><text x="642" y="247" font-size="16">Message 路由 · 收件箱 · 异步运行</text>
<rect x="968" y="179" width="268" height="94" rx="13" fill="#e2eee4"/><text x="990" y="215" font-size="22" font-weight="600">MGXEnv</text><text x="990" y="247" font-size="16">增加负责人协调与消息转发</text>
<rect x="44" y="377" width="568" height="104" rx="13" fill="#fff0d8"/><text x="67" y="413" font-size="22" font-weight="600">固定流程 / 本次实际运行</text><text x="67" y="445" font-size="17">需求 → 设计 → 拆分 → 开发 ⇄ 测试</text><text x="67" y="469" font-size="14" fill="#785b35">基于 Role + Action + _watch；动作是预编写样例，无模型调用</text>
<rect x="666" y="377" width="570" height="104" rx="13" fill="#e2eee4"/><text x="689" y="413" font-size="22" font-weight="600">动态软件团队 / 接入模型后运行</text><text x="689" y="445" font-size="17">TeamLeader → 产品经理、架构师、工程师、数据分析员</text><text x="689" y="469" font-size="14" fill="#456b4e">根据成员职责和提示词选择执行人；本次尚未验证模型分派</text>
<rect x="44" y="568" width="1192" height="174" rx="15" fill="#fff" stroke="#d5dfdb"/>
<text x="67" y="606" font-size="22" font-weight="600">角色执行层</text><text x="248" y="606" font-size="19">观察消息 → 选择动作 → 执行 → 保存结果 → 发布消息</text>
<rect x="67" y="632" width="343" height="78" rx="9" fill="#f0f4f1"/><text x="85" y="663" font-size="18" font-weight="600">Role / RoleZero</text><text x="85" y="689" font-size="15">身份、工作方法、状态、执行循环</text>
<rect x="433" y="632" width="343" height="78" rx="9" fill="#f0f4f1"/><text x="451" y="663" font-size="18" font-weight="600">Action / 工具 / 模型接口</text><text x="451" y="689" font-size="15">固定程序或模型决策，调用实际能力</text>
<rect x="799" y="632" width="413" height="78" rx="9" fill="#f0f4f1"/><text x="817" y="663" font-size="18" font-weight="600">Memory / Plan / Context</text><text x="817" y="689" font-size="15">历史信息、任务依赖、进度与共享配置</text>
<text x="44" y="771" font-size="14" fill="#63777b">依据源码 11cdf466d0 · 本图为项目研究整理 · 角色完成声明与业务验收需要分别判断</text>
</g></svg>
