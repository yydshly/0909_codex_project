<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
<title id="title">SurfSense 原有研究架构与后续扩展</title>
<desc id="desc">左侧为 NotebookLM 式资料入库、混合检索、模型问答、引用和播客；右侧为平台实时数据、外部 MCP、自动化和对外工具服务。底部为共用的模型、存储、任务及界面基础设施。早期已经存在 Agent、连接器和 API，本图不是它们的首次上线时间表。</desc>
<rect width="1800" height="1420" fill="#f3f6f8"/>
<text x="45" y="51" fill="#006e78" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="700">SURFSENSE / 能力与技术原理</text>
<text x="45" y="117" fill="#173749" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="40" font-weight="700">NotebookLM 式研究核心，向实时网络与 Agent 工具扩展</text>
<text x="45" y="162" fill="#546d7c" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400">先理解“能做什么”，再沿箭头看“如何实现”：资料准备 → 查询研究 → 成果交付。</text>
