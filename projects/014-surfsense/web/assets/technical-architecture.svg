<text x="45" y="166" fill="#506c7c" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400">技术分工：程序处理格式与数据，专用模型识别和编码，大模型生成内容，Agent 组织工具调用。</text>
