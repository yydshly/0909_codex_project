<title id="title">SurfSense 技术实现架构：解析、模型、数据、检索与工具</title>
<desc id="desc">左侧展示多格式分派、解析器适配、EtlResult 统一接口、片段索引、pgvector 混合检索和 LLM 生成。右侧展示 Agent 控制、平台采集与双向 MCP 接入，以及缓存和增量处理。不同颜色区分程序与数据库、模型推理和工具扩展。</desc>
