<title id="title">Agents Radar 一页能力与架构总览</title>
<desc id="desc">左侧列出十九个真实 GitHub 仓库、两家官网及榜单社区论文模型产品来源；沿箭头经过采集适配、筛选与模型分析，最终生成双语报告并通过网页订阅通知和 MCP 分发。</desc>
