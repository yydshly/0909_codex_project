<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1360" viewBox="0 0 1440 1360" role="img" aria-labelledby="title desc">
<title id="title">HeliosGen 详细架构：桌面交互、本地业务服务、持久化与云端能力</title>
<desc id="desc">本地桌面中的画布与状态管理解析输入、按依赖触发生成节点。本地 API 完成模型参数适配、参考素材上传和生成任务处理。云端模型返回结果，本地保存到 SQLite、媒体文件与任务状态。任务结果回到界面并供下游使用。助手请求与直接创作可直接进入 API。</desc>
