<text x="535" y="260" class="head">代理与工具环境</text>
<text x="535" y="291" class="body">浏览器采集与操作</text>
<text x="535" y="319" class="body">文件编辑 · 终端运行 · 截图</text>
<rect x="968" y="187" width="416" height="151" rx="10" fill="#e8eee5" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="991" y="219" class="label">能力来源 03</text>
<text x="991" y="260" class="head">本仓库的增量</text>
<text x="991" y="291" class="body">Skill / 检查规范 / 项目模板</text>
<text x="991" y="319" class="body">任务拆分 · 输出约定 · 验收要求</text>
<text x="56" y="385" class="label">起点：一个或多个目标 URL  /  打开网页，采集以下证据</text>
<rect x="56" y="406" width="416" height="118" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="79" y="443" class="head">截图</text>
<text x="79" y="475" class="body">最终外观与区域关系</text>
<text x="79" y="502" class="body">缺少隐藏状态和精确规则</text>
<rect x="512" y="406" width="416" height="118" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="535" y="443" class="head">DOM / CSS / 素材</text>
<text x="535" y="475" class="body">结构、样式、尺寸、文本与资源</text>
<text x="535" y="502" class="body">不等于原始组件工程</text>
<rect x="968" y="406" width="416" height="118" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="991" y="443" class="head">操作记录</text>
<text x="991" y="475" class="body">点击、悬停、滚动、调整宽度</text>
<text x="991" y="502" class="body">未观察到的行为仍然未知</text>
