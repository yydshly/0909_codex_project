<text x="79" y="291" class="body">理解截图与结构</text>
<text x="79" y="319" class="body">归纳规则 · 生成代码 · 分析偏差</text>
<rect x="512" y="187" width="416" height="151" rx="10" fill="#e8eee5" stroke="#c9d4ca" stroke-width="1.5"/>
