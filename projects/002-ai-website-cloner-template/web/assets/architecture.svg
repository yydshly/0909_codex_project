<path d="M512 904 H478" class="line"/>
<path d="M56 904 H28 V680 H50" class="feedback"/>
<text transform="translate(20 850) rotate(-90)" class="tiny" style="fill:#a94528">差异反馈</text>
<text x="996" y="799" class="tiny">分析结果写入规格</text>
<rect x="56" y="1020" width="1328" height="106" rx="10" fill="#e4ede0" stroke="#aec3b1" stroke-width="1.5"/>
<text x="82" y="1062" class="head">验证后交付：可运行、可修改的 Next.js 前端工程</text>
<text x="82" y="1100" class="body">页面 + 组件 + 路由 + 素材；复刻布局、样式、响应式与已观察到的交互。</text>
<path d="M264 985 V1014" class="line"/>
<g transform="translate(0 130)">
<rect x="56" y="1020" width="1328" height="130" rx="10" fill="#182e39" stroke="#182e39" stroke-width="1.5"/>
<text x="82" y="1059" class="head" style="fill:#f3f4e9">贯穿全过程的共享依据</text>
<text x="82" y="1097" class="body" style="fill:#d8e4dc">真实素材 + 参考截图 + 组件规格 + 状态记录 + 输出路径</text>
<text x="82" y="1128" class="body" style="fill:#b9cbc6">事实有来源；推断有标记；未覆盖项保留。生成与验收始终对照同一份依据。</text>
<text x="56" y="1195" class="label">怎样保持实现一致  /  并行只加速，不自动保证正确</text>
<rect x="56" y="1216" width="1328" height="128" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="80" y="1258" class="head">视觉与素材</text>
<text x="80" y="1294" class="tiny">同一字体、主题、容器和资源</text>
<text x="520" y="1258" class="head">接口与状态</text>
<text x="520" y="1294" class="tiny">明确输入、事件、布局与状态归属</text>
<text x="968" y="1258" class="head">修改与验收</text>
<text x="968" y="1294" class="tiny">公共文件集中维护，固定条件对照</text>
<text x="80" y="1325" class="tiny">流程约定需要实际执行；独立工作目录不能自动解决语义和接口冲突。</text>
<rect x="56" y="1372" width="1328" height="110" rx="10" fill="#f1e8db" stroke="#d5c3a9" stroke-width="1.5"/>
<text x="80" y="1412" class="head" style="fill:#8b492d">能力边界</text>
<text x="278" y="1410" class="body" style="fill:#8b492d">构建通过 ≠ 视觉一致 ≠ 行为完整 ≠ 后端业务相同</text>
<text x="80" y="1450" class="tiny">不能保证穷尽隐藏状态；Canvas / iframe 等需单独处理；认证、数据库、实时业务需要另外实现。</text>
<rect x="56" y="1510" width="1328" height="125" rx="10" fill="#f8f5ed" stroke="#a17b43" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="80" y="1550" class="head">完整系统还需补充  /  我们的建议，非上游现成能力</text>
<text x="80" y="1585" class="body">结构化契约与校验 → 任务状态与依赖 → 可重复验收 → 有界重试与断点恢复</text>
<text x="80" y="1614" class="tiny">实现顺序：先采集准确、状态覆盖和局部修复，再扩展整站与更多并行。</text>
<text x="56" y="1675" class="tiny">实线：职责与流程要求（不等于程序强制执行）    虚线：工程扩展建议</text>
<text x="1008" y="1675" class="tiny">源码快照 92872bc · 克隆效果未实测</text>
</g>
</svg>