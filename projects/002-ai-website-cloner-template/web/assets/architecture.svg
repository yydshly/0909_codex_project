<text x="56" y="574" class="label">主代理组织的处理循环  /  模型决定动作 → 工具执行 → 返回证据</text>
<rect x="56" y="599" width="416" height="163" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="80" y="632" class="label">01</text>
<text x="128" y="635" class="head">观察页面</text>
<text x="80" y="684" class="body">固定页面与环境，识别区域</text>
<text x="80" y="716" class="body">滚动加载；保存参考截图</text>
<text x="80" y="740" class="tiny">产物：页面拓扑与截图</text>
<rect x="512" y="599" width="416" height="163" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="536" y="632" class="label">02</text>
<text x="584" y="635" class="head">提取事实</text>
<text x="536" y="684" class="body">读取结构、样式、尺寸和素材</text>
<text x="536" y="716" class="body">多视口、多状态；标记遗漏</text>
<text x="536" y="740" class="tiny">产物：原始数据与资源</text>
<rect x="968" y="599" width="416" height="163" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="992" y="632" class="label">03</text>
<text x="1040" y="635" class="head">归纳与推断</text>
<text x="992" y="684" class="body">识别重复规范、布局和交互</text>
<text x="992" y="716" class="body">区分读取 / 确认 / 推断 / 未知</text>
<text x="992" y="740" class="tiny">产物：规则和状态关系</text>
<rect x="968" y="821" width="416" height="163" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="992" y="854" class="label">04</text>
<text x="1040" y="857" class="head">写入组件规格</text>
<text x="992" y="906" class="body">结构、输入、行为、素材与样式</text>
<text x="992" y="938" class="body">共享主题、接口及验收条件</text>
<text x="992" y="962" class="tiny">产物：可阅读的实现依据</text>
<rect x="512" y="821" width="416" height="163" rx="10" fill="#fffefa" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="536" y="854" class="label">05</text>
<text x="584" y="857" class="head">拆分与实现</text>
<text x="536" y="906" class="body">公共基础先行，独立任务并行</text>
<text x="536" y="938" class="body">按职责分工，再组装页面</text>
<text x="536" y="962" class="tiny">产物：Next.js 组件与路由</text>
<rect x="56" y="821" width="416" height="163" rx="10" fill="#e4ede0" stroke="#c9d4ca" stroke-width="1.5"/>
<text x="80" y="854" class="label">06</text>
<text x="128" y="857" class="head">对照与修复</text>
<text x="80" y="906" class="body">构建 + 视觉 + 交互检查</text>
<text x="80" y="938" class="body">定位差异，修采集 / 规格 / 代码</text>
<text x="80" y="962" class="tiny">产物：验收结果与已知缺口</text>
<path d="M472 680 H506" class="line"/>
<path d="M928 680 H962" class="line"/>
<path d="M1176 762 V815" class="line"/>
