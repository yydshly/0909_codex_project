<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Firecrawl：调用入口、采集服务与执行工具</title><desc id="desc">用户程序负责业务调度，通过 API 或 SDK 向 Firecrawl 提交 URL、关键词或任务。Firecrawl 发现网址、选择引擎、组织任务，调用 HTTP、浏览器或文件解析器，转换输出，再交回业务程序筛选和展示。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#697a90" stroke-width="1.4"/></marker><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#192536}.small{font-size:17px;fill:#526174}.name{font-size:23px;font-weight:700}.line{stroke:#697a90;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="780" fill="#f5f7fa"/><rect x="42" y="36" width="8" height="58" rx="3" fill="#bd390e"/><text x="70" y="62" font-size="29" font-weight="750">Firecrawl 如何把网页变成可用数据</text><text x="70" y="91" class="small">API 是入口，浏览器是工具，采集服务负责组织执行。</text>
<rect x="42" y="128" width="1116" height="94" rx="10" fill="#192536"/><text x="65" y="163" class="name" style="fill:white">你的业务程序 / Agents Radar</text><text x="65" y="194" class="small" style="fill:#d4dfec">决定关注什么、何时采集、如何筛选与展示；通过 API / SDK 提交任务</text><text x="820" y="170" font-size="18" style="fill:#ffbc98">URL · URL 列表 · 搜索词</text><text x="820" y="198" font-size="17" style="fill:#d4dfec">云端 Agent 还可接收自然语言目标</text>
<path d="M600 224V264" class="line"/>
<rect x="42" y="275" width="1116" height="135" rx="10" fill="#fff1e9" stroke="#ecc4b1"/><text x="65" y="312" class="name" style="fill:#bd390e">Firecrawl 服务</text><text x="65" y="346" font-size="19">发现网址 → 过滤范围 → 调度任务 → 选择引擎 → 超时与失败处理</text><text x="65" y="382" class="small">Search 找候选页面 · Map 找站内网址 · Crawl 发现并抓取 · Batch 处理给定列表</text>
<path d="M245 412V451M600 412V451M955 412V451" class="line"/>
<rect x="42" y="462" width="345" height="118" rx="9" fill="white" stroke="#d7dfe8"/><text x="66" y="499" class="name">HTTP 客户端</text><text x="66" y="531" class="small">向目标网页发请求</text><text x="66" y="558" class="small">取得 HTML 等响应内容</text>
<rect x="426" y="462" width="347" height="118" rx="9" fill="white" stroke="#d7dfe8"/><text x="450" y="499" class="name">浏览器引擎</text><text x="450" y="531" class="small">加载页面、执行 JavaScript</text><text x="450" y="558" class="small">按可用能力支持等待或交互</text>
<rect x="812" y="462" width="346" height="118" rx="9" fill="white" stroke="#d7dfe8"/><text x="836" y="499" class="name">文件与专用解析器</text><text x="836" y="531" class="small">PDF / 文档等处理路径</text><text x="836" y="558" class="small">能力依配置与服务提供方而异</text>
<path d="M214 582V610H599V628M986 582V610H601M600 582V628" class="line"/>
<rect x="42" y="639" width="1116" height="80" rx="10" fill="#e8eef8" stroke="#c5d3e5"/><text x="65" y="671" class="name">内容处理与交付</text><text x="65" y="700" class="small">清洗与格式转换 → Markdown / HTML / 链接 / 截图；需要时由模型提取 JSON → 交回业务程序</text>
<text x="42" y="755" font-size="15" fill="#526174">逻辑示意，非固定引擎顺序。Agent / Browser / Interact 不包含在默认自部署栈。研究日期：2026-09-09。</text></svg>
