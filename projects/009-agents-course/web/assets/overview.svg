<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">Agents Course 技术能力总览</title><desc id="desc">模型基础、Agent 执行、检索知识、框架实现、组合实战、观测与改进六个板块。</desc><rect width="1440" height="880" fill="#f5f7f8"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#183339"><text x="40" y="48" font-size="17" font-weight="600" fill="#526d71">HUGGING FACE / AGENTS COURSE</text><text x="40" y="94" font-size="34" font-weight="600" fill="#183339">Agent 开发课程：能力、原理与应用</text><text x="40" y="128" font-size="20" font-weight="400" fill="#183339">通过模型决策、工具执行与反馈循环，学习构建知识问答和多步骤任务原型。</text><rect x="40" y="158" width="444" height="302" rx="12" fill="#ffffff" stroke="#cfdddf"/><text x="58" y="193" font-size="23" font-weight="600" fill="#183339">01  理解任务</text><text x="58" y="218" font-size="16" font-weight="400" fill="#526d71">模型与输入</text><text x="58" y="250" font-size="18" font-weight="600" fill="#183339">LLM</text><text x="58" y="270" font-size="17" font-weight="400" fill="#183339">理解需求，生成回答或动作</text><text x="58" y="291" font-size="18" font-weight="600" fill="#183339">Messages</text><text x="58" y="311" font-size="17" font-weight="400" fill="#183339">组织用户、模型与工具消息</text><text x="58" y="332" font-size="18" font-weight="600" fill="#183339">System Prompt</text><text x="58" y="352" font-size="17" font-weight="400" fill="#183339">说明目标、规则和工具用法</text><text x="58" y="373" font-size="18" font-weight="600" fill="#183339">Chat Template</text><text x="58" y="393" font-size="17" font-weight="400" fill="#183339">转换为模型所需的对话格式</text><text x="58" y="414" font-size="18" font-weight="600" fill="#183339">Special Tokens</text><text x="58" y="434" font-size="17" font-weight="400" fill="#183339">标识角色、消息及调用边界</text><rect x="498" y="158" width="444" height="302" rx="12" fill="#ffffff" stroke="#cfdddf"/><text x="516" y="193" font-size="23" font-weight="600" fill="#183339">02  决策与执行</text><text x="516" y="218" font-size="16" font-weight="400" fill="#526d71">Agent 核心循环</text><text x="516" y="250" font-size="18" font-weight="600" fill="#183339">ReAct</text><text x="516" y="270" font-size="17" font-weight="400" fill="#183339">交替决策、行动并观察结果</text><text x="516" y="291" font-size="18" font-weight="600" fill="#183339">Tool / Function Calling</text><text x="516" y="311" font-size="17" font-weight="400" fill="#183339">生成工具名和参数，由程序调用</text><text x="516" y="332" font-size="18" font-weight="600" fill="#183339">Tools</text><text x="516" y="352" font-size="17" font-weight="400" fill="#183339">封装函数、搜索与外部 API</text><text x="516" y="373" font-size="18" font-weight="600" fill="#183339">Code Execution</text><text x="516" y="393" font-size="17" font-weight="400" fill="#183339">运行模型生成的代码</text><text x="516" y="414" font-size="18" font-weight="600" fill="#183339">Memory / Context</text><text x="516" y="434" font-size="17" font-weight="400" fill="#183339">保留执行记录和任务上下文</text><rect x="956" y="158" width="444" height="302" rx="12" fill="#ffffff" stroke="#cfdddf"/><text x="974" y="193" font-size="23" font-weight="600" fill="#183339">03  检索知识</text><text x="974" y="218" font-size="16" font-weight="400" fill="#526d71">外部资料与回答</text><text x="974" y="250" font-size="18" font-weight="600" fill="#183339">Chunking / Embedding</text><text x="974" y="270" font-size="17" font-weight="400" fill="#183339">文档分块，再转换为语义向量</text><text x="974" y="291" font-size="18" font-weight="600" fill="#183339">Index / Retriever</text><text x="974" y="311" font-size="17" font-weight="400" fill="#183339">建立索引，检索相关内容</text><text x="974" y="332" font-size="18" font-weight="600" fill="#183339">RAG</text><text x="974" y="352" font-size="17" font-weight="400" fill="#183339">将检索资料交给模型辅助回答</text><text x="974" y="373" font-size="18" font-weight="600" fill="#183339">Agentic RAG</text><text x="974" y="393" font-size="17" font-weight="400" fill="#183339">按任务选择检索和其他工具</text><text x="974" y="414" font-size="18" font-weight="600" fill="#183339">QueryEngine</text><text x="974" y="434" font-size="17" font-weight="400" fill="#183339">LlamaIndex 的查询与回答组件</text><rect x="40" y="476" width="444" height="302" rx="12" fill="#ffffff" stroke="#cfdddf"/><text x="58" y="511" font-size="23" font-weight="600" fill="#183339">04  框架实现</text><text x="58" y="536" font-size="16" font-weight="400" fill="#526d71">三条可选开发路径</text><text x="58" y="568" font-size="18" font-weight="600" fill="#183339">smolagents</text><text x="58" y="588" font-size="17" font-weight="400" fill="#183339">CodeAgent：用 Python 表达动作</text><text x="58" y="609" font-size="18" font-weight="600" fill="#183339">ToolCallingAgent / @tool</text><text x="58" y="629" font-size="17" font-weight="400" fill="#183339">结构化调用 / 注册自定义工具</text><text x="58" y="650" font-size="18" font-weight="600" fill="#183339">LlamaIndex</text><text x="58" y="670" font-size="17" font-weight="400" fill="#183339">数据接入、索引、查询与工作流</text><text x="58" y="691" font-size="18" font-weight="600" fill="#183339">LangGraph</text><text x="58" y="711" font-size="17" font-weight="400" fill="#183339">State / Nodes / Edges：状态与流程</text><text x="58" y="732" font-size="18" font-weight="600" fill="#183339">Workflows</text><text x="58" y="752" font-size="17" font-weight="400" fill="#183339">组织步骤、事件和执行逻辑</text><rect x="498" y="476" width="444" height="302" rx="12" fill="#ffffff" stroke="#cfdddf"/><text x="516" y="511" font-size="23" font-weight="600" fill="#183339">05  组合与实战</text><text x="516" y="536" font-size="16" font-weight="400" fill="#526d71">课程展示的应用方向</text><text x="516" y="568" font-size="18" font-weight="600" fill="#183339">Multi-Agent Systems</text><text x="516" y="588" font-size="17" font-weight="400" fill="#183339">多个 Agent 分工并汇总结果</text><text x="516" y="609" font-size="18" font-weight="600" fill="#183339">VLM / Vision Agents</text><text x="516" y="629" font-size="17" font-weight="400" fill="#183339">理解图片和页面截图</text><text x="516" y="650" font-size="18" font-weight="600" fill="#183339">Browser Agents</text><text x="516" y="670" font-size="17" font-weight="400" fill="#183339">结合浏览器工具与网页交互</text><text x="516" y="691" font-size="18" font-weight="600" fill="#183339">Agentic RAG 实战</text><text x="516" y="711" font-size="17" font-weight="400" fill="#183339">综合资料检索与外部工具回答</text><text x="516" y="732" font-size="18" font-weight="600" fill="#183339">Pokémon Agent</text><text x="516" y="752" font-size="17" font-weight="400" fill="#183339">在回合制对战中选择行动</text><rect x="956" y="476" width="444" height="302" rx="12" fill="#ffffff" stroke="#cfdddf"/><text x="974" y="511" font-size="23" font-weight="600" fill="#183339">06  观测与改进</text><text x="974" y="536" font-size="16" font-weight="400" fill="#526d71">运行评估与可选训练</text><text x="974" y="568" font-size="18" font-weight="600" fill="#183339">Observability / Tracing</text><text x="974" y="588" font-size="17" font-weight="400" fill="#183339">查看调用过程、结果和错误</text><text x="974" y="609" font-size="18" font-weight="600" fill="#183339">OpenTelemetry</text><text x="974" y="629" font-size="17" font-weight="400" fill="#183339">采集和传递运行追踪数据</text><text x="974" y="650" font-size="18" font-weight="600" fill="#183339">Token Usage / Latency</text><text x="974" y="670" font-size="17" font-weight="400" fill="#183339">观察模型用量与执行耗时</text><text x="974" y="691" font-size="18" font-weight="600" fill="#183339">GAIA / LLM-as-a-judge</text><text x="974" y="711" font-size="17" font-weight="400" fill="#183339">基准任务评测 / 模型辅助评分</text><text x="974" y="732" font-size="18" font-weight="600" fill="#183339">LoRA</text><text x="974" y="752" font-size="17" font-weight="400" fill="#183339">用于工具调用微调的低秩适配</text><text x="40" y="827" font-size="18" font-weight="400" fill="#183339">定位：课程与示例集合；框架按需选用；Memory 指任务上下文；微调为可选进阶。</text><text x="40" y="856" font-size="16" font-weight="400" fill="#526d71">来源：github.com/huggingface/agents-course · 官方课程与示例 · 核对日期 2026-09-09</text></g></svg>