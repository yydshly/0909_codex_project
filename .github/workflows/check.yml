name: Check research catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test catalog behavior
        run: python -m unittest discover -s tests -v
      - name: Validate project registry and README
        run: python scripts/catalog.py check
      - name: Build static site
        run: python scripts/catalog.py build
